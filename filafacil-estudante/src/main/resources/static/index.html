<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FilaFácil - Operador</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

<header>

    <div class="logo-area">

        <div>
            <h1>FilaFácil</h1>
            <p>Painel do Operador</p>
        </div>

    </div>

    <div class="menu-superior">

        <a href="cliente.html" target="_blank" class="btn-tv">
            🖥️ Visão do Cliente
        </a>

        <a href="metricas.html" target="_blank" class="btn-metricas">
            📊 Painel de Métricas
        </a>

    </div>

</header>

<main>

    <section class="painel">

        <h2>Resumo Geral</h2>

        <div class="cartoes">

            <div class="cartao">

                <div class="icone">🎟️</div>

                <span id="total">0</span>

                <small>Total</small>

            </div>

            <div class="cartao">

                <div class="icone">⏳</div>

                <span id="aguardando">0</span>

                <small>Aguardando</small>

            </div>

            <div class="cartao">

                <div class="icone">📢</div>

                <span id="chamadas">0</span>

                <small>Chamadas</small>

            </div>

            <div class="cartao">

                <div class="icone">✅</div>

                <span id="finalizadas">0</span>

                <small>Finalizadas</small>

            </div>

            <div class="cartao">

                <div class="icone">❌</div>

                <span id="canceladas">0</span>

                <small>Canceladas</small>

            </div>

        </div>

    </section>


    <section>

        <h2>🎫 Nova Senha</h2>

        <div class="form-grid">

            <input
                    id="nomeCliente"
                    type="text"
                    placeholder="Nome do cliente">

            <select id="tipoServico">

                <option value="GERAL">Geral</option>

                <option value="FINANCEIRO">Financeiro</option>

                <option value="TECNICO">Técnico</option>

            </select>

            <select id="prioridade">

                <option value="NORMAL">Normal</option>

                <option value="PRIORITARIA">Prioritária</option>

            </select>

            <button onclick="criarSenha()">
                Gerar Senha
            </button>

        </div>

    </section>



    <section>

        <h2>📢 Chamar Próxima</h2>

        <div class="form-grid">

            <select id="politica">

                <option value="FIFO">Ordem de chegada (FIFO)</option>

                <option value="PRIORIDADE">Prioridade primeiro</option>

            </select>

            <select id="canal">

                <option value="CONSOLE">Notificar por console</option>

                <option value="EMAIL">Notificar por email</option>

            </select>

            <button onclick="chamarProxima()">
                Chamar Próxima Senha
            </button>

        </div>

    </section>



    <section>

        <h2>📋 Senhas</h2>

        <div class="table-container">

            <table>

                <thead>

                <tr>

                    <th>Número</th>

                    <th>Cliente</th>

                    <th>Serviço</th>

                    <th>Prioridade</th>

                    <th>Status</th>

                    <th>Ações</th>

                </tr>

                </thead>

                <tbody id="corpoTabela">

                </tbody>

            </table>

        </div>

    </section>

</main>

<script src="app.js"></script>

</body>
</html>
